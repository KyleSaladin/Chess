<!DOCTYPE html>

                    <span class="arrow" id="VariantArrow">▶</span>
                </div>
                <ul class="variant-list" id="VariantList">
                    <li data-variant="Chess">Chess</li>
                    <li data-variant="PowChess">Pow Chess</li>

                </ul>

    <!-- Room selection overlay -->
    <div id="roomOverlay">

            <div id="iuizt">- OR -</div>
            <button type="button" id="AIButton">🎯 Against AI </button>
            <div id="iuizt">- OR -</div>

        </div>

    <!-- End game overlay -->

                <label>Light Squares:</label>
                <input type="color" id="ColorPickerLight" value="#FBF3D7" />

                <label>Dark Squares:</label>
